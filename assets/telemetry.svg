<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="128" viewBox="0 0 1200 128" role="img">
<defs>
  <radialGradient id="field" cx="22%" cy="35%" r="80%">
