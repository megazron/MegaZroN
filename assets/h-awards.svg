<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="56" viewBox="0 0 1200 56" role="img">
<defs>
  <radialGradient id="field" cx="22%" cy="35%" r="80%">
    <stop offset="0" stop-color="#0a2e11"/><stop offset=".55" stop-color="#06180a"/><stop offset="1" stop-color="#030d05"/>
  </radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3dfa46" stop-opacity=".32"/><stop offset="1" stop-color="#3dfa46" stop-opacity=".02"/>
  </linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8ffe0"/><stop offset=".38" stop-color="#7fd18c"/><stop offset="1" stop-color="#2c6b36"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3dfa46" stop-opacity="0"/><stop offset=".5" stop-color="#3dfa46" stop-opacity=".35"/><stop offset="1" stop-color="#3dfa46" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3dfa46" stop-opacity="0"/><stop offset=".5" stop-color="#3dfa46" stop-opacity=".22"/><stop offset="1" stop-color="#3dfa46" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#3dfa46" stroke-opacity=".07"/>
  </pattern>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" fill-opacity=".28"/>
  </pattern>
  <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="7" height="14" fill="#3dfa46" fill-opacity=".55"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 0" additive="sum" dur="1.2s" repeatCount="indefinite"/>
  </pattern>
  <pattern id="dashbar" width="1" height="7" patternUnits="userSpaceOnUse">
    <rect width="3" height="2" fill="#3dfa46"/>
  </pattern>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowlg" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  
</defs>
<rect width="1200" height="56" fill="url(#field)"/>
<rect width="1200" height="56" fill="url(#grid)"/>
<path d="M0 4H1184L1200 20V52H0Z" fill="#0a2e11" fill-opacity=".92" stroke="#1f7a2c" stroke-width="1"/><rect x="0" y="10" width="3" height="36" fill="url(#dashbar)" opacity=".7"/><path d="M1178 5h21v21" fill="none" stroke="#3dfa46" stroke-opacity=".8"/><rect x="0" y="4" width="140" height="48" fill="url(#glint)"><animate attributeName="x" values="-140;1200" dur="5s" repeatCount="indefinite"/></rect><circle cx="24" cy="28" r="4" fill="#3dfa46" filter="url(#glow)"><animate attributeName="r" values="4;2.4;4" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.55;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="40" y="24" font-family="'Share Tech Mono','JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="10" fill="#3dfa46" letter-spacing="2.5">RECOGNITION</text><text x="40" y="45" font-family="'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#eafff0" letter-spacing="1.5">AWARDS &amp; HONOURS</text><text x="1164" y="35" text-anchor="end" font-family="'Share Tech Mono','JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" fill="#6aa876" letter-spacing="1.5">53 IN TOTAL</text><rect x="1176" y="24" width="10" height="12" fill="url(#hazard)"/><rect width="1200" height="56" fill="url(#scanlines)" pointer-events="none"/>
